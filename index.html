<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支教信息发布平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<!-- 顶部横幅 -->
<section style="background: linear-gradient(135deg, #EBF3FA 0%, #D4E6F9 100%); padding: 48px 0 40px;">
  <div style="max-width:1200px; margin:0 auto; padding:0 20px; text-align:center;">
    <h1 style="font-size:32px; color:var(--primary-dark); margin-bottom:10px;">让知识跨越山海</h1>
    <p style="font-size:16px; color:var(--text-secondary); max-width:600px; margin:0 auto 20px;">
      连接支教学校与热心志愿者，共同助力乡村教育
    </p>
  </div>
</section>

<main class="main">

  <!-- 搜索栏 -->
  <div class="search-bar">
    <input type="text" class="form-input" id="searchKeyword" placeholder="搜索活动标题">
    <input type="text" class="form-input" id="searchRegion" placeholder="地区（如：四川凉山）" style="max-width:220px;">
    <select class="form-input" id="searchState" style="max-width:160px;">
      <option value="">全部状态</option>
      <option value="0">招募中</option>
      <option value="1">进行中</option>
      <option value="2">已结束</option>
    </select>
    <button class="btn btn-primary" onclick="searchActivities()">搜索</button>
    <button class="btn btn-outline" onclick="resetSearch()">重置</button>
  </div>

  <!-- 统计卡片 -->
  <div class="stat-grid">
    <div class="card stat-card">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">累计支教活动</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="stat-recruiting">0</div>
      <div class="stat-label">招募中</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="stat-ongoing">0</div>
      <div class="stat-label">进行中</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="stat-ended">0</div>
      <div class="stat-label">已结束</div>
    </div>
  </div>

  <!-- 活动列表 -->
  <h2 class="card-title" style="margin-bottom:18px;">支教活动</h2>
  <div class="activity-grid" id="activityList">
    <div class="empty-state" style="grid-column:1/-1;">
      <div class="empty-icon">&#128269;</div>
      <p>暂无符合条件的活动</p>
    </div>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="js/main.js"></script>
<script>
// ===== 模拟数据 =====
const mockActivities = [
  {
    activityId: 1,
    title: '凉山州昭觉县小学暑期支教',
    content: '面向昭觉县三所村小开展为期四周的暑期支教活动，涵盖语文、数学、英语、美术等课程，同时开展课外阅读推广。',
    recruitsNumber: 12,
    volunteerDuration: 80,
    activityState: '0',
    auditState: '1',
    address: '四川省凉山州昭觉县',
    schoolName: '昭觉县希望小学',
    publishTime: '2026-05-10 08:30:00',
    schoolUserName: '昭觉县希望小学'
  },
  {
    activityId: 2,
    title: '云南红河哈尼族彝族自治州英语支教',
    content: '为红河州山区小学提供英语启蒙教学，帮助孩子们打开语言学习的窗口。要求志愿者具备良好的英语口语能力。',
    recruitsNumber: 8,
    volunteerDuration: 60,
    activityState: '0',
    auditState: '1',
    address: '云南省红河州元阳县',
    schoolName: '元阳县民族小学',
    publishTime: '2026-05-12 14:00:00',
    schoolUserName: '元阳县民族小学'
  },
  {
    activityId: 3,
    title: '贵州黔东南苗族侗族自治州科普支教',
    content: '面向黔东南州乡村小学开展科普教育活动，包括基础科学实验、计算机启蒙、自然观察等内容。',
    recruitsNumber: 10,
    volunteerDuration: 40,
    activityState: '1',
    auditState: '1',
    address: '贵州省黔东南州台江县',
    schoolName: '台江县方召镇中心小学',
    publishTime: '2026-04-20 09:00:00',
    schoolUserName: '台江县方召镇中心小学'
  },
  {
    activityId: 4,
    title: '甘肃陇南礼县音乐美育支教',
    content: '为礼县乡村小学带去音乐和美育课程，包括合唱训练、简谱教学、绘画基础等，丰富孩子们的课余生活。',
    recruitsNumber: 6,
    volunteerDuration: 48,
    activityState: '1',
    auditState: '1',
    address: '甘肃省陇南市礼县',
    schoolName: '礼县白河镇中心小学',
    publishTime: '2026-04-15 10:00:00',
    schoolUserName: '礼县白河镇中心小学'
  },
  {
    activityId: 5,
    title: '青海玉树藏族自治州冬季助学支教',
    content: '在寒假期间为玉树州牧区小学提供课业辅导和兴趣课程，同时开展暖冬物资发放活动。',
    recruitsNumber: 15,
    volunteerDuration: 72,
    activityState: '2',
    auditState: '1',
    address: '青海省玉树州囊谦县',
    schoolName: '囊谦县第一完全小学',
    publishTime: '2025-12-01 08:00:00',
    schoolUserName: '囊谦县第一完全小学'
  },
  {
    activityId: 6,
    title: '广西百色革命老区阅读推广支教',
    content: '为百色革命老区乡村小学建立班级图书角，开展阅读指导课程，培养孩子们的阅读习惯和表达能力。',
    recruitsNumber: 8,
    volunteerDuration: 40,
    activityState: '0',
    auditState: '1',
    address: '广西壮族自治区百色市田东县',
    schoolName: '田东县思林镇中心小学',
    publishTime: '2026-05-15 09:30:00',
    schoolUserName: '田东县思林镇中心小学'
  }
];

const stateMap = { '0': '招募中', '1': '进行中', '2': '已结束' };
const stateClassMap = { '0': 'tag-recruiting', '1': 'tag-ongoing', '2': 'tag-ended' };

let currentPage = 1;
const pageSize = 6;

function renderActivities(activities) {
  const container = document.getElementById('activityList');
  if (!activities.length) {
    container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">&#128269;</div><p>暂无符合条件的活动</p></div>';
    return;
  }

  container.innerHTML = activities.map(act => `
    <div class="card activity-card" onclick="viewDetail(${act.activityId})">
      <h3 class="card-title">${escHtml(act.title)}</h3>
      <div class="activity-meta">
        <span>&#127979; ${escHtml(act.schoolName)}</span>
        <span>&#128205; ${escHtml(act.address)}</span>
        <span>&#128101; 招募 ${act.recruitsNumber} 人</span>
        <span>&#9200; ${act.volunteerDuration}h 志愿时长</span>
      </div>
      <div class="activity-tags">
        <span class="tag ${stateClassMap[act.activityState]}">${stateMap[act.activityState]}</span>
      </div>
      <p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
        ${escHtml(act.content)}
      </p>
      <div class="activity-footer">
        <span>发布：${act.publishTime.split(' ')[0]}</span>
        <span style="color:var(--primary);font-weight:500;">查看详情 &rarr;</span>
      </div>
    </div>
  `).join('');

  updateStats(activities);
}

function updateStats(allActivities) {
  document.getElementById('stat-total').textContent = allActivities.length;
  document.getElementById('stat-recruiting').textContent = allActivities.filter(a => a.activityState === '0').length;
  document.getElementById('stat-ongoing').textContent = allActivities.filter(a => a.activityState === '1').length;
  document.getElementById('stat-ended').textContent = allActivities.filter(a => a.activityState === '2').length;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function searchActivities() {
  const keyword = document.getElementById('searchKeyword').value.toLowerCase();
  const region = document.getElementById('searchRegion').value.toLowerCase();
  const state = document.getElementById('searchState').value;

  const filtered = mockActivities.filter(act => {
    if (keyword && !act.title.toLowerCase().includes(keyword)) return false;
    if (region && !act.address.toLowerCase().includes(region)) return false;
    if (state && act.activityState !== state) return false;
    return true;
  });

  currentPage = 1;
  renderActivities(filtered);
  renderPagination(filtered.length);
}

function resetSearch() {
  document.getElementById('searchKeyword').value = '';
  document.getElementById('searchRegion').value = '';
  document.getElementById('searchState').value = '';
  currentPage = 1;
  renderActivities(mockActivities);
  renderPagination(mockActivities.length);
}

function viewDetail(id) {
  window.location.href = `pages/activity-detail.html?id=${id}`;
}

function renderPagination(total) {
  const container = document.getElementById('pagination');
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) { container.innerHTML = ''; return; }

  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">&laquo;</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">&raquo;</button>`;
  container.innerHTML = html;
}

function goPage(page) {
  currentPage = page;
  searchActivities();
  window.scrollTo({ top: 400, behavior: 'smooth' });
}

// 初始化
renderActivities(mockActivities);
renderPagination(mockActivities.length);
</script>
</body>
</html>
