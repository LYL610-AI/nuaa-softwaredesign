<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-header">
    <h1>欢迎回来</h1>
    <p>登录支教信息发布平台</p>
  </div>

  <!-- 角色选择 -->
  <div class="role-tabs">
    <button class="role-tab active" data-role="volunteer">志愿者</button>
    <button class="role-tab" data-role="school">学校用户</button>
    <button class="role-tab" data-role="admin">管理员</button>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="userId">账号</label>
      <input type="text" id="userId" class="form-input" placeholder="请输入账号" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">密码</label>
      <div class="password-wrapper">
        <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
        <button type="button" class="password-toggle" tabindex="-1">&#x1F441;</button>
      </div>
    </div>

    <div class="form-group" style="display:flex;justify-content:space-between;align-items:center;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400;">
        <input type="checkbox" id="rememberMe"> 记住账号
      </label>
      <a href="#" onclick="showToast('请联系管理员重置密码', 'warning');return false;" style="font-size:13px;">忘记密码？</a>
    </div>

    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">登 录</button>
  </form>

  <div class="auth-footer">
    还没有账号？<a href="register.html">立即注册</a>
    <br><br>
    <a href="../index.html" style="font-size:13px;color:var(--text-muted);">&larr; 返回首页</a>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
let selectedRole = 'volunteer';

// 角色切换
document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedRole = tab.dataset.role;
  });
});

// 登录提交
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const userId = document.getElementById('userId').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!userId || !password) {
    showToast('请填写账号和密码', 'warning');
    return;
  }

  const roleMap = { volunteer: 1, school: 2, admin: 3 };
  userApi.login(userId, password, roleMap[selectedRole])
    .then(user => {
      setToken(user.token);
      setCurrentUser(user);
      showToast('登录成功，欢迎回来！', 'success');
      setTimeout(() => { window.location.href = '../index.html'; }, 800);
    })
    .catch(err => {
      showToast(err.message || '登录失败，请检查账号密码', 'error');
    });
});

// 记住账号
const savedId = localStorage.getItem('rememberedUserId');
if (savedId) {
  document.getElementById('userId').value = savedId;
  document.getElementById('rememberMe').checked = true;
}
</script>
</body>
</html>
