<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">
  <h1 class="page-title">用户管理</h1>

  <div class="tabs">
    <button class="tab-item active" data-tab="volunteer">志愿者用户</button>
    <button class="tab-item" data-tab="school">学校用户</button>
  </div>

  <div class="search-bar" style="margin-top:16px;">
    <input type="text" class="form-input" id="searchPhone" placeholder="输入手机号搜索">
    <button class="btn btn-primary" onclick="searchUsers()">搜索</button>
    <button class="btn btn-outline" onclick="resetSearch()">重置</button>
  </div>

  <div class="tab-content active" id="tab-volunteer">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>用户ID</th><th>姓名</th><th>身份证号</th><th>手机号</th><th>性别</th><th>学历</th><th>注册时间</th><th>操作</th></tr>
          </thead>
          <tbody id="volunteerBody">
            <tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="volunteerPagination"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-school" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>用户ID</th><th>学校名称</th><th>手机号</th><th>负责人</th><th>办学许可证</th><th>学校类型</th><th>注册时间</th><th>操作</th></tr>
          </thead>
          <tbody id="schoolBody">
            <tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="schoolPagination"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
let currentPermission = 1;
let currentPage = 1;
const pageSize = 10;
const userCache = {};

document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
    currentPermission = tab.dataset.tab === 'volunteer' ? 1 : 2;
    currentPage = 1;
    loadUsers();
  });
});

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadUsers() {
  const tbodyId = currentPermission === 1 ? 'volunteerBody' : 'schoolBody';
  const paginationId = currentPermission === 1 ? 'volunteerPagination' : 'schoolPagination';
  const tbody = document.getElementById(tbodyId);
  const keyword = document.getElementById('searchPhone').value.trim();

  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  try {
    const result = await api.get('/user/list', { permission: currentPermission, keyword, page: currentPage, pageSize });
    const list = result.list || result || [];
    const total = result.total || 0;
    list.forEach(u => { userCache[u.user_id] = u; });
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">暂无用户</td></tr>';
    } else if (currentPermission === 1) {
      tbody.innerHTML = list.map(u => `
        <tr>
          <td>${escHtml(u.user_id + '')}</td>
          <td>${escHtml(u.user_name || '—')}</td>
          <td>${escHtml(u.id_number || '—')}</td>
          <td>${escHtml(u.user_phone || '—')}</td>
          <td>${escHtml(u.user_sex || '—')}</td>
          <td>${escHtml(u.user_edu || '—')}</td>
          <td>${(u.register_time || '').toString().split(' ')[0]}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="showEditUser('${u.user_id}', 1)">编辑</button>
            <button class="btn btn-outline btn-sm" onclick="showResetPwd('${u.user_id}', 1, '${escHtml(u.user_phone || '')}')">修改密码</button>
          </td>
        </tr>
      `).join('');
    } else {
      tbody.innerHTML = list.map(u => `
        <tr>
          <td>${escHtml(u.user_id + '')}</td>
          <td>${escHtml(u.school_name || '—')}</td>
          <td>${escHtml(u.user_phone || '—')}</td>
          <td>${escHtml(u.principle || '—')}</td>
          <td>${escHtml(u.license || '—')}</td>
          <td>${escHtml(u.type || '—')}</td>
          <td>${(u.register_time || '').toString().split(' ')[0]}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="showEditUser('${u.user_id}', 2)">编辑</button>
            <button class="btn btn-outline btn-sm" onclick="showResetPwd('${u.user_id}', 2, '${escHtml(u.user_phone || '')}')">修改密码</button>
          </td>
        </tr>
      `).join('');
    }
    renderPagination(total, paginationId);
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  }
}

function renderPagination(total, containerId) {
  const container = document.getElementById(containerId);
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">&laquo;</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">&raquo;</button>`;
  container.innerHTML = html;
}

function goPage(page) {
  currentPage = page;
  loadUsers();
}

function searchUsers() {
  currentPage = 1;
  loadUsers();
}

function resetSearch() {
  document.getElementById('searchPhone').value = '';
  currentPage = 1;
  loadUsers();
}

function showEditUser(userId, permission) {
  const u = userCache[userId];
  if (!u) { showToast('用户信息未加载', 'warning'); return; }

  if (permission === 1) {
    showModal('编辑志愿者信息', `
      <div class="form-group">
        <label>用户ID</label>
        <input type="text" class="form-input" value="${escHtml(u.user_id)}" disabled style="background:#f5f5f5;">
      </div>
      <div class="form-group">
        <label>身份证号</label>
        <input type="text" class="form-input" value="${escHtml(u.id_number || '—')}" disabled style="background:#f5f5f5;">
        <small style="color:var(--text-muted);">身份证号不可修改</small>
      </div>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="editUserName" class="form-input" value="${escHtml(u.user_name || '')}">
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="editUserPhone" class="form-input" value="${escHtml(u.user_phone || '')}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>性别</label>
          <select id="editUserSex" class="form-input">
            <option value="">请选择</option>
            <option value="男" ${u.user_sex === '男' ? 'selected' : ''}>男</option>
            <option value="女" ${u.user_sex === '女' ? 'selected' : ''}>女</option>
          </select>
        </div>
        <div class="form-group">
          <label>学历</label>
          <select id="editUserEdu" class="form-input">
            <option value="">请选择</option>
            <option value="高中" ${u.user_edu === '高中' ? 'selected' : ''}>高中</option>
            <option value="专科" ${u.user_edu === '专科' ? 'selected' : ''}>专科</option>
            <option value="本科" ${u.user_edu === '本科' ? 'selected' : ''}>本科</option>
            <option value="硕士" ${u.user_edu === '硕士' ? 'selected' : ''}>硕士</option>
            <option value="博士" ${u.user_edu === '博士' ? 'selected' : ''}>博士</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>新密码（留空则不修改）</label>
        <input type="password" id="editUserPwd" class="form-input" placeholder="留空则保持原密码" minlength="6">
      </div>
    `, async () => {
      const data = {
        permission: 1,
        userName: document.getElementById('editUserName').value.trim(),
        userPhone: document.getElementById('editUserPhone').value.trim(),
        userSex: document.getElementById('editUserSex').value,
        userEdu: document.getElementById('editUserEdu').value,
        userPassword: document.getElementById('editUserPwd').value
      };
      try {
        await userApi.adminUpdate(userId, data);
        showToast('修改成功', 'success');
        loadUsers();
      } catch (err) {
        showToast(err.message || '修改失败', 'error');
      }
    });
  } else {
    showModal('编辑学校用户信息', `
      <div class="form-group">
        <label>用户ID</label>
        <input type="text" class="form-input" value="${escHtml(u.user_id)}" disabled style="background:#f5f5f5;">
      </div>
      <div class="form-group">
        <label>学校名称</label>
        <input type="text" id="editSchoolName" class="form-input" value="${escHtml(u.school_name || '')}">
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input type="text" id="editUserPhone" class="form-input" value="${escHtml(u.user_phone || '')}">
      </div>
      <div class="form-group">
        <label>负责人</label>
        <input type="text" id="editPrinciple" class="form-input" value="${escHtml(u.principle || '')}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>学校类型</label>
          <select id="editType" class="form-input">
            <option value="">请选择</option>
            <option value="小学" ${u.type === '小学' ? 'selected' : ''}>小学</option>
            <option value="初中" ${u.type === '初中' ? 'selected' : ''}>初中</option>
            <option value="高中" ${u.type === '高中' ? 'selected' : ''}>高中</option>
          </select>
        </div>
        <div class="form-group">
          <label>办学许可证号</label>
          <input type="text" id="editLicense" class="form-input" value="${escHtml(u.license || '')}">
        </div>
      </div>
      <div class="form-group">
        <label>学校地址</label>
        <input type="text" id="editAddress" class="form-input" value="${escHtml(u.address || '')}">
      </div>
      <div class="form-group">
        <label>新密码（留空则不修改）</label>
        <input type="password" id="editUserPwd" class="form-input" placeholder="留空则保持原密码" minlength="6">
      </div>
    `, async () => {
      const data = {
        permission: 2,
        schoolName: document.getElementById('editSchoolName').value.trim(),
        userPhone: document.getElementById('editUserPhone').value.trim(),
        principle: document.getElementById('editPrinciple').value.trim(),
        type: document.getElementById('editType').value,
        license: document.getElementById('editLicense').value.trim(),
        address: document.getElementById('editAddress').value.trim(),
        userPassword: document.getElementById('editUserPwd').value
      };
      try {
        await userApi.adminUpdate(userId, data);
        showToast('修改成功', 'success');
        loadUsers();
      } catch (err) {
        showToast(err.message || '修改失败', 'error');
      }
    });
  }
}

function showResetPwd(userId, permission, phone) {
  showModal('修改密码', `
    <p>用户手机号：<strong>${escHtml(phone)}</strong></p>
    <div class="form-group" style="margin-top:12px;">
      <label>新密码 <span style="color:var(--danger);">*</span></label>
      <input type="password" id="resetNewPwd" class="form-input" placeholder="请输入6-20位新密码" minlength="6" required>
    </div>
  `, async () => {
    const newPassword = document.getElementById('resetNewPwd').value.trim();
    if (newPassword.length < 6) { showToast('密码至少6位', 'warning'); return; }
    try {
      await api.put('/user/reset-password/' + userId, { permission: String(permission), newPassword });
      showToast('密码修改成功', 'success');
    } catch (err) {
      showToast(err.message || '修改失败', 'error');
    }
  });
}

loadUsers();
</script>
</body>
</html>
