<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核管理 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">
  <h1 class="page-title">审核管理</h1>

  <!-- 统计卡片 -->
  <div class="stat-grid">
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);" id="stat-activity">—</div>
      <div class="stat-label">待审核活动</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);" id="stat-post">—</div>
      <div class="stat-label">待审核帖子</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);" id="stat-summary">—</div>
      <div class="stat-label">待审核总结</div>
    </div>
  </div>

  <!-- 审核标签页 -->
  <div class="tabs">
    <button class="tab-item active" data-tab="activity">活动审核</button>
    <button class="tab-item" data-tab="post">帖子审核</button>
    <button class="tab-item" data-tab="summary">总结审核</button>
  </div>

  <!-- 活动审核 -->
  <div class="tab-content active" id="tab-activity">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动ID</th><th>标题</th><th>发布学校</th><th>招募人数</th><th>发布时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewActivityBody">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 帖子审核 -->
  <div class="tab-content" id="tab-post" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>帖子ID</th><th>标题</th><th>发布者</th><th>关联活动</th><th>发布时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewPostBody">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 总结审核 -->
  <div class="tab-content" id="tab-summary" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动名称</th><th>发布学校</th><th>总结标题</th><th>提交时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewSummaryBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const auditClassMap = { '0': 'tag-pending', '1': 'tag-approved', '2': 'tag-rejected' };
const auditMap = { '0': '待审核', '1': '审核通过', '2': '未通过' };

// 标签页切换
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
  });
});

function loadActivities() {
  const tbody = document.getElementById('reviewActivityBody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  api.get('/activity/list', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">暂无待审核活动</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(act => `
      <tr>
        <td>${act.activityId}</td>
        <td>${escHtml(act.title)}</td>
        <td>${escHtml(act.schoolName || '')}</td>
        <td>${act.recruitsNumber}</td>
        <td>${(act.publishTime || '').split(' ')[0]}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-outline btn-sm" onclick="viewActivityDetail('${act.activityId}')">查看</button>
            <button class="btn btn-success btn-sm" onclick="reviewItem('activity', '${act.activityId}', '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('activity', '${act.activityId}', '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

function loadPosts() {
  const tbody = document.getElementById('reviewPostBody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  api.get('/post/list', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">暂无待审核帖子</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr>
        <td>${p.postId}</td>
        <td>${escHtml(p.title)}</td>
        <td>${escHtml(p.authorName || '用户' + p.userId)}</td>
        <td>${escHtml(p.activityTitle || '活动' + p.activityId)}</td>
        <td>${(p.publishTime || '').split(' ')[0]}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-outline btn-sm" onclick="viewPostDetail('${p.postId}')">查看</button>
            <button class="btn btn-success btn-sm" onclick="reviewItem('post', '${p.postId}', '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('post', '${p.postId}', '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

function loadSummaries() {
  const tbody = document.getElementById('reviewSummaryBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  api.get('/activity/summary/list', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">暂无待审核总结</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(s => `
      <tr>
        <td>${escHtml(s.activityTitle || '')}</td>
        <td>${escHtml(s.schoolName || '')}</td>
        <td>${escHtml(s.summaryTitle || '')}</td>
        <td>${(s.summarySubmitTime || '').split(' ')[0]}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-outline btn-sm" onclick="viewSummaryDetail('${s.activityId}')">查看</button>
            <button class="btn btn-success btn-sm" onclick="reviewItem('summary', '${s.activityId}', '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('summary', '${s.activityId}', '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

// 审核操作
function reviewItem(type, id, state) {
  const typeNames = { activity: '活动', post: '帖子', summary: '总结' };
  const stateText = state === '1' ? '通过' : '退回';

  showModal(`${state === '1' ? '✓' : '✗'} 审核${typeNames[type]}`, `<p>确认<strong>${stateText}</strong>该${typeNames[type]}申请？</p>`, async () => {
    try {
      if (type === 'activity') await activityApi.review(id, state);
      else if (type === 'post') await postApi.review(id, state);
      else if (type === 'summary') await activityApi.reviewSummary(id, state);
      showToast(`${typeNames[type]}已${stateText}`, 'success');
      loadPendingCounts();
      if (type === 'activity') loadActivities();
      else if (type === 'post') loadPosts();
      else if (type === 'summary') loadSummaries();
    } catch (err) {
      showToast(err.message || '操作失败', 'error');
    }
  });
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 查看详情 =====
async function viewActivityDetail(id) {
  try {
    const a = await api.get('/activity/detail/' + id);
    showModal('活动详情', `
      <p><strong>标题：</strong>${escHtml(a.title)}</p>
      <p><strong>学校：</strong>${escHtml(a.schoolName || '')}</p>
      <p><strong>地址：</strong>${escHtml(a.schoolAddress || '')}</p>
      <p><strong>招募人数：</strong>${a.recruitsNumber}</p>
      <p><strong>发布时间：</strong>${a.publishTime}</p>
      <p><strong>活动内容：</strong></p>
      <p style="max-height:350px;overflow-y:auto;overflow-x:hidden;word-break:break-all;white-space:pre-wrap;line-height:1.8;color:var(--text-secondary);">${escHtml(a.content)}</p>
    `, null);
  } catch (err) { showToast('加载详情失败', 'error'); }
}

async function viewPostDetail(id) {
  try {
    const p = await api.get('/post/detail/' + id);
    showModal('帖子详情', `
      <p><strong>标题：</strong>${escHtml(p.title)}</p>
      <p><strong>发布者：</strong>${escHtml(p.authorName || '用户' + p.userId)}</p>
      <p><strong>关联活动：</strong>${escHtml(p.activityTitle || '活动' + p.activityId)}</p>
      <p><strong>发布时间：</strong>${p.publishTime}</p>
      <p><strong>内容：</strong></p>
      <p style="max-height:350px;overflow-y:auto;overflow-x:hidden;word-break:break-all;white-space:pre-wrap;line-height:1.8;color:var(--text-secondary);">${escHtml(p.content)}</p>
    `, null);
  } catch (err) { showToast('加载详情失败', 'error'); }
}

async function viewSummaryDetail(id) {
  try {
    const data = await api.get('/activity/summary/list', { pageSize: 100 });
    const list = data.list || data || [];
    const s = list.find(x => x.activityId === id);
    if (!s) { showToast('未找到总结记录', 'error'); return; }
    showModal('总结详情', `
      <p><strong>活动：</strong>${escHtml(s.title || '')}</p>
      <p><strong>学校：</strong>${escHtml(s.schoolName || '')}</p>
      <p><strong>总结标题：</strong>${escHtml(s.summaryTitle || '')}</p>
      <p><strong>提交时间：</strong>${s.summarySubmitTime || '—'}</p>
      <p><strong>总结内容：</strong></p>
      <p style="max-height:350px;overflow-y:auto;overflow-x:hidden;word-break:break-all;white-space:pre-wrap;line-height:1.8;color:var(--text-secondary);">${escHtml(s.summaryContent || '')}</p>
    `, null);
  } catch (err) { showToast('加载详情失败', 'error'); }
}

// 加载待审核数量
async function loadPendingCounts() {
  try {
    const [actRes, postRes, sumRes] = await Promise.all([
      api.get('/activity/list', { auditState: '0', pageSize: 999 }),
      api.get('/post/list', { auditState: '0', pageSize: 999 }),
      api.get('/activity/summary/list', { auditState: '0', pageSize: 999 })
    ]);
    const count = (res) => res.total != null ? res.total : (Array.isArray(res) ? res.length : (res.list || []).length);
    document.getElementById('stat-activity').textContent = count(actRes);
    document.getElementById('stat-post').textContent = count(postRes);
    document.getElementById('stat-summary').textContent = count(sumRes);
  } catch (err) { /* silent */ }
}

// 初始化加载
loadPendingCounts();
loadActivities();
loadPosts();
loadSummaries();
</script>
</body>
</html>
