<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核管理 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">
  <h1 class="page-title">审核管理</h1>

  <!-- 统计卡片 -->
  <div class="stat-grid">
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);">3</div>
      <div class="stat-label">待审核活动</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);">5</div>
      <div class="stat-label">待审核报名</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);">2</div>
      <div class="stat-label">待审核帖子</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" style="color:var(--warning);">1</div>
      <div class="stat-label">待审核总结</div>
    </div>
  </div>

  <!-- 审核标签页 -->
  <div class="tabs">
    <button class="tab-item active" data-tab="activity">活动审核</button>
    <button class="tab-item" data-tab="registration">报名审核</button>
    <button class="tab-item" data-tab="post">帖子审核</button>
    <button class="tab-item" data-tab="summary">总结审核</button>
  </div>

  <!-- 活动审核 -->
  <div class="tab-content active" id="tab-activity">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动ID</th><th>标题</th><th>发布学校</th><th>招募人数</th><th>发布时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewActivityBody">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 报名审核 -->
  <div class="tab-content" id="tab-registration" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>报名ID</th><th>活动名称</th><th>志愿者</th><th>性别</th><th>学历</th><th>报名时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewRegBody">
            <tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 帖子审核 -->
  <div class="tab-content" id="tab-post" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>帖子ID</th><th>标题</th><th>发布者</th><th>关联活动</th><th>发布时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewPostBody">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 总结审核 -->
  <div class="tab-content" id="tab-summary" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动名称</th><th>发布学校</th><th>总结标题</th><th>提交时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewSummaryBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const auditClassMap = { '0': 'tag-pending', '1': 'tag-approved', '2': 'tag-rejected' };
const auditMap = { '0': '待审核', '1': '审核通过', '2': '未通过' };

// 标签页切换
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
  });
});

// 加载审核列表
async function loadReviewList(type, tbodyId, columns, renderRow) {
  const tbody = document.getElementById(tbodyId);
  tbody.innerHTML = '<tr><td colspan="' + columns + '" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  try {
    const url = type === 'activity' ? '/activity/list' : type === 'registration' ? '/registration/list' : type === 'post' ? '/post/list' : '/activity/summary/list';
    const result = await api.get(url, { auditState: '0', pageSize: 50 });
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="' + columns + '" style="text-align:center;color:var(--text-muted);">暂无待审核项</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(item => renderRow(item)).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="' + columns + '" style="text-align:center;color:var(--text-muted);">加载失败，请检查后端服务</td></tr>';
  }
}

function loadActivities() {
  const tbody = document.getElementById('reviewActivityBody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  api.get('/activity/list', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">暂无待审核活动</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(act => `
      <tr>
        <td>${act.activityId}</td>
        <td>${escHtml(act.title)}</td>
        <td>${escHtml(act.schoolName || '')}</td>
        <td>${act.recruitsNumber}</td>
        <td>${(act.publishTime || '').split(' ')[0]}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-success btn-sm" onclick="reviewItem('activity', ${act.activityId}, '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('activity', ${act.activityId}, '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

function loadRegistrations() {
  const tbody = document.getElementById('reviewRegBody');
  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  // Admin sees all pending registrations
  api.get('/registration/list/all', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">暂无待审核报名</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(r => `
      <tr>
        <td>${r.registrationId}</td>
        <td>${escHtml(r.activityTitle || '活动' + r.activityId)}</td>
        <td>${escHtml(r.realName)}</td>
        <td>${r.gender || '—'}</td>
        <td>${r.degree || '—'}</td>
        <td>${r.entryTime}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-success btn-sm" onclick="reviewItem('registration', ${r.registrationId}, '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('registration', ${r.registrationId}, '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

function loadPosts() {
  const tbody = document.getElementById('reviewPostBody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  api.get('/post/list', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">暂无待审核帖子</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr>
        <td>${p.postId}</td>
        <td>${escHtml(p.title)}</td>
        <td>${escHtml(p.authorName || '用户' + p.userId)}</td>
        <td>${escHtml(p.activityTitle || '活动' + p.activityId)}</td>
        <td>${(p.publishTime || '').split(' ')[0]}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-success btn-sm" onclick="reviewItem('post', ${p.postId}, '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('post', ${p.postId}, '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

function loadSummaries() {
  const tbody = document.getElementById('reviewSummaryBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>';
  api.get('/activity/summary/list', { auditState: '0', pageSize: 50 }).then(result => {
    const list = result.list || result || [];
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">暂无待审核总结</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(s => `
      <tr>
        <td>${escHtml(s.activityTitle || '')}</td>
        <td>${escHtml(s.schoolName || '')}</td>
        <td>${escHtml(s.summaryTitle || '')}</td>
        <td>${(s.submitTime || '').split(' ')[0]}</td>
        <td><span class="tag tag-pending">待审核</span></td>
        <td>
          <div class="action-group">
            <button class="btn btn-success btn-sm" onclick="reviewItem('summary', ${s.activityId}, '1')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="reviewItem('summary', ${s.activityId}, '2')">退回</button>
          </div>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  });
}

// 审核操作
function reviewItem(type, id, state) {
  const typeNames = { activity: '活动', registration: '报名', post: '帖子', summary: '总结' };
  const stateText = state === '1' ? '通过' : '退回';

  let contentHtml = `<p>确认<strong>${stateText}</strong>该${typeNames[type]}申请？</p>`;
  let reasonInput = '';
  if (state === '2') {
    reasonInput = 'reasonText';
    contentHtml += `
      <div class="form-group" style="margin-top:12px;">
        <label>退回原因</label>
        <textarea class="form-input" id="${reasonInput}" rows="3" placeholder="请输入退回原因（选填）"></textarea>
      </div>
    `;
  }

  showModal(`${state === '1' ? '✓' : '✗'} 审核${typeNames[type]}`, contentHtml, async () => {
    try {
      const reason = state === '2' ? (document.getElementById('reasonText')?.value || '') : '';
      if (type === 'activity') await activityApi.review(id, state, reason);
      else if (type === 'registration') await registrationApi.review(id, state);
      else if (type === 'post') await postApi.review(id, state);
      else if (type === 'summary') await activityApi.reviewSummary(id, state);
      showToast(`${typeNames[type]}已${stateText}`, 'success');
      // 刷新对应列表
      if (type === 'activity') loadActivities();
      else if (type === 'registration') loadRegistrations();
      else if (type === 'post') loadPosts();
      else if (type === 'summary') loadSummaries();
    } catch (err) {
      showToast(err.message || '操作失败', 'error');
    }
  });
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 初始化加载
loadActivities();
loadRegistrations();
loadPosts();
loadSummaries();
</script>
</body>
</html>
