<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布支教活动 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">
  <a href="../index.html" style="font-size:14px;color:var(--primary);display:inline-block;margin-bottom:20px;">&larr; 返回首页</a>

  <div class="card" style="max-width:900px;margin:0 auto;">
    <div class="card-header">
      <h2 class="card-title">发布支教招募信息</h2>
    </div>

    <form id="publishForm">
      <div class="form-group">
        <label for="title">活动标题 <span style="color:var(--danger);">*</span></label>
        <input type="text" id="title" class="form-input" placeholder="请输入活动标题（100字以内）" required maxlength="100">
      </div>

      <div class="form-group">
        <label for="content">活动内容 <span style="color:var(--danger);">*</span></label>
        <textarea id="content" class="form-input" rows="10" placeholder="请详细描述支教活动内容、教学目标、课程安排等" required style="max-height:400px;overflow-y:auto;resize:vertical;"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="recruitsNumber">招募人数 <span style="color:var(--danger);">*</span></label>
          <input type="number" id="recruitsNumber" class="form-input" placeholder="请输入招募人数" required min="1" value="5">
        </div>
        <div class="form-group">
          <label for="startDate">开始日期</label>
          <input type="date" id="startDate" class="form-input">
        </div>
        <div class="form-group">
          <label for="endDate">结束日期</label>
          <input type="date" id="endDate" class="form-input">
        </div>
      </div>

      <div class="form-group">
        <label for="address">活动地址 <span style="color:var(--danger);">*</span></label>
        <input type="text" id="address" class="form-input" placeholder="省/市/县/镇/乡" required>
      </div>

      <div class="form-group">
        <label>封面图片</label>
        <div class="image-upload-area" id="coverUploadArea">
          <input type="file" id="coverFile" accept="image/*" style="display:none" onchange="handleCoverSelect(event)">
          <div class="image-upload-box" id="coverUploadBox" onclick="document.getElementById('coverFile').click()">
            <span id="coverPlaceholder">+ 点击上传封面图片</span>
            <img id="coverPreview" src="" alt="" style="display:none;max-width:100%;max-height:200px;border-radius:8px;">
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="coverRemoveBtn" style="display:none;margin-top:8px;" onclick="removeCover()">移除图片</button>
        </div>
      </div>

      <div class="form-group" style="margin-top:28px;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400;">
          <input type="checkbox" id="confirmInfo"> 我确认以上信息真实有效，提交后将由管理员审核
        </label>
      </div>

      <div style="display:flex;gap:12px;margin-top:24px;">
        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" disabled>提交审核</button>
      </div>
    </form>
  </div>

  <!-- 我发布的活动列表 -->
  <div class="card" style="margin-top:24px;max-width:900px;margin:24px auto 0;">
    <div class="card-header">
      <h3 class="card-title">我发布的活动</h3>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>标题</th><th>招募人数</th><th>活动状态</th><th>审核状态</th><th>发布时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="myActivities">
          <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- 编辑活动弹窗 -->
<div class="modal-overlay" id="editActivityModal">
  <div class="modal" style="max-width:720px;">
    <div class="modal-header">
      <h3 class="modal-title">编辑活动信息</h3>
      <button class="modal-close" onclick="document.getElementById('editActivityModal').classList.remove('show')">&times;</button>
    </div>
    <div class="modal-body" style="max-height:65vh;overflow-y:auto;padding-right:4px;">
      <form id="editActivityForm">
        <div class="form-group">
          <label>活动标题</label>
          <input type="text" id="editTitle" class="form-input" required maxlength="100">
        </div>
        <div class="form-group">
          <label>活动内容</label>
          <textarea id="editContent" class="form-input" rows="8" required style="max-height:300px;overflow-y:auto;resize:vertical;"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>招募人数</label>
            <input type="number" id="editRecruits" class="form-input" required min="1">
          </div>
          <div class="form-group">
            <label>开始日期</label>
            <input type="date" id="editStartDate" class="form-input">
          </div>
          <div class="form-group">
            <label>结束日期</label>
            <input type="date" id="editEndDate" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label>活动地址</label>
          <input type="text" id="editAddress" class="form-input">
        </div>
        <div class="form-group">
          <label>封面图片</label>
          <div class="image-upload-area" id="editPictureUploadArea">
            <input type="file" id="editPictureFile" accept="image/*" style="display:none" onchange="handleEditCoverSelect(event)">
            <div class="image-upload-box" id="editPictureUploadBox" onclick="document.getElementById('editPictureFile').click()">
              <span id="editPicturePlaceholder">+ 点击上传封面图片</span>
              <img id="editPicturePreview" src="" alt="" style="display:none;max-width:100%;max-height:200px;border-radius:8px;">
            </div>
            <button type="button" class="btn btn-outline btn-sm" id="editPictureRemoveBtn" style="display:none;margin-top:8px;" onclick="removeEditCover()">移除图片</button>
          </div>
        </div>
        <div class="form-group">
          <label>活动状态</label>
          <select id="editState" class="form-input">
            <option value="0">招募中</option>
            <option value="1">进行中</option>
            <option value="2">已结束</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('editActivityModal').classList.remove('show')">取消</button>
      <button class="btn btn-primary" onclick="submitEditActivity()">保存修改</button>
    </div>
  </div>
</div>

<!-- 提交总结弹窗 -->
<div class="modal-overlay" id="summaryModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">提交活动总结</h3>
      <button class="modal-close" onclick="document.getElementById('summaryModal').classList.remove('show')">&times;</button>
    </div>
<div class="modal-body">
      <div id="summaryRejectTip" style="display:none;background:#fff2f0;border:1px solid #ffccc7;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#cf1322;font-size:14px;">
        &#9888; 上次提交的活动总结未通过管理员审核，请修改后重新提交。
      </div>
      <form id="summaryForm">
        <div class="form-group">
          <label>总结标题</label>
          <input type="text" id="summaryTitle" class="form-input" placeholder="请输入总结标题" required>
        </div>
        <div class="form-group">
          <label>总结内容</label>
          <textarea id="summaryContent" class="form-input" rows="5" placeholder="请详细描述活动开展情况、教学成果等" required></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('summaryModal').classList.remove('show')">取消</button>
      <button class="btn btn-primary" onclick="submitSummary()">提交审核</button>
    </div>
  </div>
</div>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const stateMap = { '0': '招募中', '1': '进行中', '2': '已结束' };
const stateClassMap = { '0': 'tag-recruiting', '1': 'tag-ongoing', '2': 'tag-ended' };
const auditClassMap = { '0': 'tag-pending', '1': 'tag-approved', '2': 'tag-rejected' };
const auditMap = { '0': '待审核', '1': '审核通过', '2': '未通过' };

document.getElementById('confirmInfo').addEventListener('change', function() {
  document.getElementById('submitBtn').disabled = !this.checked;
});

// ===== 图片上传 =====
let pictureUrl = '';
let editPictureUrl = '';
let editPictureFileChanged = false;

async function handleCoverSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pictureUrl = await fileApi.upload(file);
    document.getElementById('coverPreview').src = pictureUrl;
    document.getElementById('coverPreview').style.display = 'block';
    document.getElementById('coverPlaceholder').style.display = 'none';
    document.getElementById('coverRemoveBtn').style.display = 'inline-block';
  } catch (err) {
    showToast(err.message || '上传失败', 'error');
    e.target.value = '';
  }
}

function removeCover() {
  pictureUrl = '';
  document.getElementById('coverPreview').src = '';
  document.getElementById('coverPreview').style.display = 'none';
  document.getElementById('coverPlaceholder').style.display = 'block';
  document.getElementById('coverRemoveBtn').style.display = 'none';
  document.getElementById('coverFile').value = '';
}

async function handleEditCoverSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    editPictureUrl = await fileApi.upload(file);
    editPictureFileChanged = true;
    document.getElementById('editPicturePreview').src = editPictureUrl;
    document.getElementById('editPicturePreview').style.display = 'block';
    document.getElementById('editPicturePlaceholder').style.display = 'none';
    document.getElementById('editPictureRemoveBtn').style.display = 'inline-block';
  } catch (err) {
    showToast(err.message || '上传失败', 'error');
    e.target.value = '';
  }
}

function removeEditCover() {
  editPictureUrl = '';
  editPictureFileChanged = true;
  document.getElementById('editPicturePreview').src = '';
  document.getElementById('editPicturePreview').style.display = 'none';
  document.getElementById('editPicturePlaceholder').style.display = 'block';
  document.getElementById('editPictureRemoveBtn').style.display = 'none';
  document.getElementById('editPictureFile').value = '';
}

document.getElementById('publishForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();

  if (!title || !content) {
    showToast('请填写完整信息', 'warning');
    return;
  }

  try {
    await activityApi.create({
      title,
      content,
      recruitsNumber: parseInt(document.getElementById('recruitsNumber').value),
      startDate: document.getElementById('startDate').value,
      endDate: document.getElementById('endDate').value,
      address: document.getElementById('address').value.trim(),
      pictureUrl: pictureUrl
    });
    showToast('活动已提交，等待管理员审核', 'success');
    document.getElementById('publishForm').reset();
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('confirmInfo').checked = false;
    removeCover();
    loadMyActivities();
  } catch (err) {
    showToast(err.message || '发布失败', 'error');
  }
});

// ===== 活动编辑 =====
let editActivityId = null;
function showEditModal(actId) {
  const act = myActivityCache[actId];
  if (!act) return;
  editActivityId = actId;
  editPictureFileChanged = false;
  document.getElementById('editTitle').value = act.title || '';
  document.getElementById('editContent').value = act.content || '';
  document.getElementById('editRecruits').value = act.recruitsNumber || 1;
  document.getElementById('editStartDate').value = act.startDate || '';
  document.getElementById('editEndDate').value = act.endDate || '';
  document.getElementById('editAddress').value = act.schoolAddress || '';
  document.getElementById('editState').value = act.activityState || '0';
  editPictureUrl = act.pictureUrl || '';
  if (editPictureUrl) {
    document.getElementById('editPicturePreview').src = editPictureUrl;
    document.getElementById('editPicturePreview').style.display = 'block';
    document.getElementById('editPicturePlaceholder').style.display = 'none';
    document.getElementById('editPictureRemoveBtn').style.display = 'inline-block';
  } else {
    document.getElementById('editPicturePreview').src = '';
    document.getElementById('editPicturePreview').style.display = 'none';
    document.getElementById('editPicturePlaceholder').style.display = 'block';
    document.getElementById('editPictureRemoveBtn').style.display = 'none';
  }
  document.getElementById('editActivityModal').classList.add('show');
}

async function submitEditActivity() {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  if (!title || !content) { showToast('请填写完整信息', 'warning'); return; }
  try {
    await api.put('/activity/update/' + editActivityId, {
      title,
      content,
      recruitsNumber: parseInt(document.getElementById('editRecruits').value),
      startDate: document.getElementById('editStartDate').value,
      endDate: document.getElementById('editEndDate').value,
      address: document.getElementById('editAddress').value.trim(),
      activityState: document.getElementById('editState').value,
      pictureUrl: editPictureFileChanged ? editPictureUrl : (myActivityCache[editActivityId] && myActivityCache[editActivityId].pictureUrl) || editPictureUrl
    });
    document.getElementById('editActivityModal').classList.remove('show');
    showToast('活动已更新', 'success');
    loadMyActivities();
  } catch (err) {
    showToast(err.message || '修改失败', 'error');
  }
}

// ===== 活动状态变更（需确认） =====
function changeActivityState(id, newState) {
  const stateNames = { '0': '招募中', '1': '进行中', '2': '已结束' };
  showModal('确认切换状态', `<p>确定将活动状态切换为<strong>${stateNames[newState]}</strong>吗？</p>`, async () => {
    try {
      await activityApi.changeState(id, newState);
      showToast('状态已更新', 'success');
      loadMyActivities();
    } catch (err) {
      showToast(err.message || '操作失败', 'error');
    }
  });
}

async function deleteActivity(id) {
  showModal('确认删除', '<p>确定要删除该活动吗？删除后不可恢复。</p>', async () => {
    try {
      await activityApi.delete(id);
      showToast('活动已删除', 'success');
      loadMyActivities();
    } catch (err) {
      showToast(err.message || '删除失败', 'error');
    }
  });
}

// ===== 活动总结 =====
let summaryActivityId = null;
function showSummaryModal(activityId) {
  summaryActivityId = activityId;
  const act = myActivityCache[activityId];
  const modal = document.getElementById('summaryModal');
  if (act && act.summaryTitle) {
    document.getElementById('summaryTitle').value = act.summaryTitle || '';
    document.getElementById('summaryContent').value = act.summaryContent || '';
    if (act.summaryAuditState === '2') {
      modal.querySelector('.modal-title').textContent = '重新提交活动总结';
      modal.querySelector('.modal-title').style.color = 'var(--danger)';
      modal.querySelector('.modal-footer .btn-primary').textContent = '重新提交审核';
      document.getElementById('summaryRejectTip').style.display = 'block';
    } else {
      modal.querySelector('.modal-title').textContent = '查看/修改总结';
      modal.querySelector('.modal-title').style.color = '';
      modal.querySelector('.modal-footer .btn-primary').textContent = '更新总结';
      document.getElementById('summaryRejectTip').style.display = 'none';
    }
  } else {
    document.getElementById('summaryForm').reset();
    modal.querySelector('.modal-title').textContent = '提交活动总结';
    modal.querySelector('.modal-title').style.color = '';
    modal.querySelector('.modal-footer .btn-primary').textContent = '提交审核';
    document.getElementById('summaryRejectTip').style.display = 'none';
  }
  modal.classList.add('show');
}

async function submitSummary() {
  const title = document.getElementById('summaryTitle').value.trim();
  const content = document.getElementById('summaryContent').value.trim();
  if (!title || !content) { showToast('请填写完整信息', 'warning'); return; }
  try {
    await activityApi.submitSummary(summaryActivityId, { title, content });
    document.getElementById('summaryModal').classList.remove('show');
    showToast('总结已提交，等待管理员审核', 'success');
    loadMyActivities();
  } catch (err) {
    showToast(err.message || '提交失败', 'error');
  }
}

// ===== 加载我的活动 =====
let myActivityCache = {};
async function loadMyActivities() {
  try {
    const list = await api.get('/activity/my');
    const tbody = document.getElementById('myActivities');
    myActivityCache = {};
    list.forEach(a => { myActivityCache[a.activityId] = a; });
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">暂无发布的活动</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(act => `
      <tr>
        <td>${escHtml(act.title)}</td>
        <td>${act.recruitsNumber}</td>
        <td>
          <span class="tag ${stateClassMap[act.activityState]}">${stateMap[act.activityState]}</span>
          ${act.auditState === '1' && act.activityState !== '2' ? `<select class="form-input" style="width:110px;padding:4px 8px;font-size:13px;margin-left:6px;"
            onchange="if(this.value)changeActivityState('${act.activityId}', this.value);this.value=''">
            <option value="">切换状态</option>
            <option value="0" ${act.activityState==='0'?'disabled':''}>招募中</option>
            <option value="1" ${act.activityState==='1'?'disabled':''}>进行中</option>
          </select>` : ''}
        </td>
        <td><span class="tag ${auditClassMap[act.auditState]}">${auditMap[act.auditState]}</span></td>
        <td>${(act.publishTime || '').split(' ')[0]}</td>
        <td>
          <div class="action-group">
            ${act.auditState === '0' ? `<button class="btn btn-outline btn-sm" onclick="showEditModal('${act.activityId}')">编辑</button>` : ''}
            ${act.auditState === '1' && !act.summaryTitle ? `<button class="btn btn-primary btn-sm" onclick="showSummaryModal('${act.activityId}')">提交总结</button>` : ''}
            ${act.summaryTitle && act.summaryAuditState === '2' ? `<button class="btn btn-warning btn-sm" onclick="showSummaryModal('${act.activityId}')">重新提交总结</button>` : ''}
            ${act.summaryTitle && act.summaryAuditState !== '2' ? `<button class="btn btn-outline btn-sm" onclick="showSummaryModal('${act.activityId}')">查看总结</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteActivity('${act.activityId}')">删除</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    // 后端未就绪时静默
  }
}

// 弹窗关闭
['editActivityModal','summaryModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
});

loadMyActivities();

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
