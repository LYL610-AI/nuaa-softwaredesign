<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支教活动 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">
  <h1 class="page-title">支教活动</h1>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <input type="text" class="form-input" id="searchKeyword" placeholder="搜索活动标题">
    <input type="text" class="form-input" id="searchRegion" placeholder="地区（如：四川凉山）" style="max-width:220px;">
    <select class="form-input" id="searchState" style="max-width:160px;">
      <option value="">全部状态</option>
      <option value="0">招募中</option>
      <option value="1">进行中</option>
      <option value="2">已结束</option>
    </select>
    <button class="btn btn-primary" onclick="searchActivities()">搜索</button>
    <button class="btn btn-outline" onclick="resetSearch()">重置</button>
  </div>

  <!-- 统计卡片 -->
  <div class="stat-grid">
    <div class="card stat-card">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">累计支教活动</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="stat-recruiting">0</div>
      <div class="stat-label">招募中</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="stat-ongoing">0</div>
      <div class="stat-label">进行中</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="stat-ended">0</div>
      <div class="stat-label">已结束</div>
    </div>
  </div>

  <!-- 活动列表 -->
  <div class="activity-grid" id="activityList">
    <div class="empty-state" style="grid-column:1/-1;">
      <div class="empty-icon">&#128269;</div>
      <p>暂无符合条件的活动</p>
    </div>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const stateMap = { '0': '招募中', '1': '进行中', '2': '已结束' };
const stateClassMap = { '0': 'tag-recruiting', '1': 'tag-ongoing', '2': 'tag-ended' };

let currentPage = 1;
let totalItems = 0;
const pageSize = 9;

function renderActivities(activities) {
  const container = document.getElementById('activityList');
  if (!activities.length) {
    container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">&#128269;</div><p>暂无符合条件的活动</p></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  container.innerHTML = activities.map(act => `
    <div class="card activity-card" onclick="viewDetail('${act.activityId}')">
      <h3 class="card-title">${escHtml(act.title)}</h3>
      <div class="activity-meta">
        <span>&#127979; ${escHtml(act.schoolName)}</span>
        <span>&#128205; ${escHtml(act.address)}</span>
        <span>&#128101; 招募 ${act.recruitsNumber} 人</span>
        <span>&#9200; ${act.volunteerDuration}h 志愿时长</span>
      </div>
      <div class="activity-tags">
        <span class="tag ${stateClassMap[act.activityState]}">${stateMap[act.activityState]}</span>
      </div>
      <p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
        ${escHtml(act.content)}
      </p>
      <div class="activity-footer">
        <span>发布：${(act.publishTime || '').split(' ')[0]}</span>
        <span style="color:var(--primary);font-weight:500;">查看详情 &rarr;</span>
      </div>
    </div>
  `).join('');
}

function updateStats(stats) {
  document.getElementById('stat-total').textContent = stats.total || 0;
  document.getElementById('stat-recruiting').textContent = stats.recruiting || 0;
  document.getElementById('stat-ongoing').textContent = stats.ongoing || 0;
  document.getElementById('stat-ended').textContent = stats.ended || 0;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadActivities() {
  const keyword = document.getElementById('searchKeyword').value.trim();
  const region = document.getElementById('searchRegion').value.trim();
  const state = document.getElementById('searchState').value;

  try {
    const result = await activityApi.list({
      keyword,
      region,
      state: state || undefined,
      page: currentPage,
      pageSize
    });
    const list = result.list || result;
    const total = result.total || list.length;
    totalItems = total;
    renderActivities(list);
    if (result.stats) updateStats(result.stats);
    renderPagination(total);
  } catch (err) {
    document.getElementById('activityList').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">&#9888;</div><p>加载失败，请检查后端服务</p></div>';
  }
}

function searchActivities() {
  currentPage = 1;
  loadActivities();
}

function resetSearch() {
  document.getElementById('searchKeyword').value = '';
  document.getElementById('searchRegion').value = '';
  document.getElementById('searchState').value = '';
  currentPage = 1;
  loadActivities();
}

function viewDetail(id) {
  window.location.href = 'activity-detail.html?id=' + id;
}

function renderPagination(total) {
  const container = document.getElementById('pagination');
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) { container.innerHTML = ''; return; }

  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">&laquo;</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">&raquo;</button>`;
  container.innerHTML = html;
}

function goPage(page) {
  currentPage = page;
  loadActivities();
  window.scrollTo({ top: 300, behavior: 'smooth' });
}

loadActivities();
</script>
</body>
</html>
