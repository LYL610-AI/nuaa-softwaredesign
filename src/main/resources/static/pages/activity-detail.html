<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动详情 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">
  <a href="../index.html" style="font-size:14px;color:var(--primary);display:inline-block;margin-bottom:20px;">&larr; 返回活动列表</a>

  <div class="detail-section" id="detailContent"></div>
</main>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<!-- 报名弹窗 -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">报名参加支教活动</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="registerForm">
        <div class="form-group">
          <label>真实姓名 <span style="color:var(--danger);">*</span></label>
          <input type="text" class="form-input" id="regRealName" placeholder="请输入真实姓名" required>
        </div>
        <div class="form-group">
          <label>手机号 <span style="color:var(--danger);">*</span></label>
          <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" required pattern="1[3-9]\d{9}">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>性别</label>
            <select class="form-input" id="regGender">
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="form-group">
            <label>学历</label>
            <select class="form-input" id="regDegree">
              <option value="">请选择</option>
              <option value="高中">高中</option>
              <option value="专科">专科</option>
              <option value="本科">本科</option>
              <option value="硕士">硕士</option>
              <option value="博士">博士</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>自我介绍</label>
          <textarea class="form-input" id="regSchoolWork" rows="4" placeholder="请简要介绍自己，如教育背景、教学经验、特长等"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitRegistration()">提交报名</button>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const stateMap = { '0': '招募中', '1': '进行中', '2': '已结束' };
const stateClassMap = { '0': 'tag-recruiting', '1': 'tag-ongoing', '2': 'tag-ended' };
const auditMap = { '0': '待审核', '1': '审核通过', '2': '未通过' };
const auditClassMap = { '0': 'tag-pending', '1': 'tag-approved', '2': 'tag-rejected' };

let currentActivityId = null;

function getUrlParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

async function loadDetail() {
  const id = getUrlParam('id');
  if (!id) { showToast('缺少活动ID', 'error'); return; }
  currentActivityId = id;

  try {
    const act = await activityApi.detail(id);
    renderDetail(act);
    checkRegistrationStatus();

    // 学校用户额外加载报名列表
    const user = getCurrentUser();
    const permission = user ? user.userPermission : null;
    if (permission === ROLE.SCHOOL) {
      await loadRegistrations(id);
    }
  } catch (err) {
    showToast(err.message || '加载活动失败', 'error');
  }
}

function renderDetail(act) {
  const container = document.getElementById('detailContent');
  const user = getCurrentUser();
  const permission = user ? user.userPermission : null;

  container.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">${escHtml(act.title)}</h2>
        <div class="activity-tags">
          <span class="tag ${stateClassMap[act.activityState]}">${stateMap[act.activityState]}</span>
          <span class="tag ${auditClassMap[act.auditState]}">${auditMap[act.auditState]}</span>
        </div>
      </div>
      <div class="detail-info">
        <div class="info-row"><span class="label">发布学校</span><span class="value">${escHtml(act.schoolName)}</span></div>
        <div class="info-row"><span class="label">活动地址</span><span class="value">${escHtml(act.address)}</span></div>
        <div class="info-row"><span class="label">招募人数</span><span class="value">${act.recruitsNumber} 人</span></div>
        <div class="info-row"><span class="label">志愿时长</span><span class="value">${act.volunteerDuration} 小时</span></div>
        <div class="info-row"><span class="label">发布时间</span><span class="value">${act.publishTime}</span></div>
        <div class="info-row"><span class="label">审核时间</span><span class="value">${act.auditTime || '—'}</span></div>
      </div>
      <div style="margin-top:20px;">
        <h4 style="margin-bottom:10px;">活动内容</h4>
        <p style="line-height:1.8;color:var(--text-secondary);white-space:pre-wrap;">${escHtml(act.content)}</p>
      </div>
      ${act.summaryAuditState === '1' ? `
        <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--border);">
          <h4 style="margin-bottom:10px;color:var(--primary);">活动总结：${escHtml(act.summaryTitle || '')}</h4>
          <p style="line-height:1.8;color:var(--text-secondary);white-space:pre-wrap;">${escHtml(act.summaryContent || '')}</p>
          <p style="font-size:13px;color:var(--text-muted);margin-top:8px;">提交时间：${act.summarySubmitTime || '—'}</p>
        </div>
      ` : ''}
      ${act.activityState === '0' && permission === ROLE.VOLUNTEER ? `
        <div style="margin-top:24px;">
          <button class="btn btn-primary btn-lg" id="registerBtn" onclick="openRegisterModal()">我要报名</button>
        </div>
      ` : ''}
    </div>

    <div id="registrationSection"></div>
  `;
}

async function checkRegistrationStatus() {
  const btn = document.getElementById('registerBtn');
  if (!btn || !isLoggedIn()) return;
  try {
    const registered = await registrationApi.check(currentActivityId);
    if (registered) {
      btn.textContent = '您已报名该活动';
      btn.className = 'btn btn-outline btn-lg';
      btn.disabled = true;
      btn.onclick = null;
    }
  } catch (err) { /* silent */ }
}

async function loadRegistrations(activityId) {
  try {
    const list = await registrationApi.list(activityId);
    const section = document.getElementById('registrationSection');
    if (!section) return;

    section.innerHTML = `
      <div class="card" style="margin-top:24px;">
        <div class="card-header">
          <h3 class="card-title">报名列表（${list.length}）</h3>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>姓名</th><th>性别</th><th>学历</th><th>自我介绍</th><th>报名时间</th><th>审核状态</th><th>操作</th></tr>
            </thead>
            <tbody>
              ${list.map(r => `
                <tr>
                  <td>${escHtml(r.realName)}</td>
                  <td>${r.gender || '—'}</td>
                  <td>${r.degree || '—'}</td>
                  <td>${r.schoolWork || '—'}</td>
                  <td>${r.entryTime}</td>
                  <td><span class="tag ${auditClassMap[r.auditState]}">${auditMap[r.auditState]}</span></td>
                  <td>
                    ${r.auditState === '0' ? `
                      <div class="action-group">
                        <button class="btn btn-success btn-sm" onclick="reviewReg('${r.registrationId}', '1')">通过</button>
                        <button class="btn btn-danger btn-sm" onclick="reviewReg('${r.registrationId}', '2')">退回</button>
                      </div>
                    ` : '<span style="color:var(--text-muted);font-size:13px;">已处理</span>'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } catch (err) {
    showToast('加载报名列表失败', 'error');
  }
}

function openRegisterModal() {
  if (!isLoggedIn()) {
    showToast('请先登录后再报名', 'warning');
    setTimeout(() => { window.location.href = 'login.html'; }, 1000);
    return;
  }
  document.getElementById('registerModal').classList.add('show');
}

function closeModal() {
  document.getElementById('registerModal').classList.remove('show');
}

async function submitRegistration() {
  const realName = document.getElementById('regRealName').value.trim();
  const phoneNumber = document.getElementById('regPhone').value.trim();
  const gender = document.getElementById('regGender').value;
  const degree = document.getElementById('regDegree').value;
  const schoolWork = document.getElementById('regSchoolWork').value.trim();

  if (!realName || !phoneNumber) {
    showToast('请填写必填信息', 'warning');
    return;
  }

  try {
    await registrationApi.submit({
      activityId: currentActivityId,
      realName,
      phoneNumber,
      gender,
      degree,
      schoolWork
    });
    showToast('报名提交成功，请等待学校审核', 'success');
    closeModal();
  } catch (err) {
    showToast(err.message || '报名失败', 'error');
  }
}

async function reviewReg(regId, state) {
  try {
    await registrationApi.review(regId, state);
    const text = state === '1' ? '通过' : '退回';
    showToast(`已${text}该报名申请`, 'success');
    await loadRegistrations(currentActivityId);
  } catch (err) {
    showToast(err.message || '操作失败', 'error');
  }
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('registerModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadDetail();
</script>
</body>
</html>
