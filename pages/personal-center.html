<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">

  <!-- 用户信息卡片 -->
  <div class="card profile-header">
    <div class="profile-avatar">&#128100;</div>
    <div class="profile-info">
      <h3 id="profileName">用户</h3>
      <p id="profileRole">角色：—</p>
      <p id="profilePhone">手机号：—</p>
      <p id="profileTime">注册时间：—</p>
    </div>
    <div style="margin-left:auto;">
      <button class="btn btn-outline btn-sm" onclick="showEditProfile()">编辑资料</button>
    </div>
  </div>

  <!-- 功能标签页 -->
  <div class="tabs" style="margin-top:24px;">
    <button class="tab-item active" data-tab="registrations">我的报名</button>
    <button class="tab-item" data-tab="activities">我的活动</button>
    <button class="tab-item" data-tab="posts">我的帖子</button>
    <button class="tab-item" data-tab="security">账号安全</button>
  </div>

  <!-- 我的报名 -->
  <div class="tab-content active" id="tab-registrations">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动名称</th><th>报名时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>凉山州昭觉县小学暑期支教</td>
              <td>2026-05-12 14:30:00</td>
              <td><span class="tag tag-approved">已通过</span></td>
              <td>
                <button class="btn btn-danger btn-sm" onclick="cancelRegistration(1)">取消报名</button>
              </td>
            </tr>
            <tr>
              <td>广西百色革命老区阅读推广支教</td>
              <td>2026-05-16 10:00:00</td>
              <td><span class="tag tag-pending">待审核</span></td>
              <td>
                <button class="btn btn-danger btn-sm" onclick="cancelRegistration(2)">取消报名</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 我的活动（学校用户） -->
  <div class="tab-content" id="tab-activities" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动标题</th><th>状态</th><th>发布时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>凉山州昭觉县小学暑期支教</td>
              <td><span class="tag tag-recruiting">招募中</span></td>
              <td>2026-05-10</td>
              <td>
                <div class="action-group">
                  <button class="btn btn-outline btn-sm" onclick="showToast('编辑功能暂未开放', 'warning')">编辑</button>
                  <button class="btn btn-primary btn-sm" onclick="showSummaryModal()">提交总结</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 我的帖子 -->
  <div class="tab-content" id="tab-posts" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>标题</th><th>关联活动</th><th>发布时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>凉山支教回忆——那些难忘的日子</td>
              <td>凉山州昭觉县小学暑期支教</td>
              <td>2026-05-15</td>
              <td><span class="tag tag-approved">审核通过</span></td>
              <td><button class="btn btn-danger btn-sm">删除</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 账号安全 -->
  <div class="tab-content" id="tab-security" style="display:none;">
    <div class="card" style="max-width:500px;">
      <h3 style="margin-bottom:20px;">修改密码</h3>
      <form id="changePwdForm">
        <div class="form-group">
          <label for="oldPassword">原密码</label>
          <input type="password" id="oldPassword" class="form-input" placeholder="请输入原密码" required>
        </div>
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" class="form-input" placeholder="6-20 位新密码" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">确认新密码</label>
          <input type="password" id="confirmNewPassword" class="form-input" placeholder="再次输入新密码" required>
        </div>
        <button type="submit" class="btn btn-primary">修改密码</button>
      </form>
    </div>
  </div>
</main>

<!-- 提交总结弹窗 -->
<div class="modal-overlay" id="summaryModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">提交活动总结</h3>
      <button class="modal-close" onclick="document.getElementById('summaryModal').classList.remove('show')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="summaryForm">
        <div class="form-group">
          <label>总结标题</label>
          <input type="text" class="form-input" placeholder="请输入总结标题" required>
        </div>
        <div class="form-group">
          <label>总结内容</label>
          <textarea class="form-input" rows="5" placeholder="请详细描述活动开展情况、参与志愿者、教学成果等" required></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('summaryModal').classList.remove('show')">取消</button>
      <button class="btn btn-primary" onclick="submitSummary()">提交审核</button>
    </div>
  </div>
</div>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script>
// 标签页切换
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + target).style.display = 'block';
  });
});

// 加载用户信息
function loadProfile() {
  const user = getCurrentUser();
  if (!user) return;
  document.getElementById('profileName').textContent = user.userId || '用户';
  document.getElementById('profileRole').textContent = '角色：' + (ROLE_NAME[user.userPermission] || '—');
  document.getElementById('profilePhone').textContent = '手机号：' + (user.userPhone || '—');
}

function showEditProfile() {
  showToast('编辑资料功能暂未开放', 'warning');
}

function cancelRegistration(id) {
  showModal('确认取消', '<p>确定要取消该报名吗？取消后不可恢复。</p>', () => {
    showToast('报名已取消', 'success');
  });
}

function showSummaryModal() {
  document.getElementById('summaryModal').classList.add('show');
}

function submitSummary() {
  document.getElementById('summaryModal').classList.remove('show');
  showToast('总结已提交，等待管理员审核', 'success');
}

document.getElementById('summaryModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

document.getElementById('changePwdForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const np = document.getElementById('newPassword').value;
  const cp = document.getElementById('confirmNewPassword').value;
  if (np !== cp) {
    showToast('两次密码不一致', 'warning');
    return;
  }
  showToast('密码修改成功', 'success');
});

loadProfile();
</script>
</body>
</html>
