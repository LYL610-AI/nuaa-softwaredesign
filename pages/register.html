<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .register-container { width: 520px; }
    .form-section { display: none; }
    .form-section.active { display: block; }
  </style>
</head>
<body class="auth-page">

<div class="auth-container register-container">
  <div class="auth-header">
    <h1>创建账号</h1>
    <p>加入支教信息发布平台</p>
  </div>

  <!-- 角色选择 -->
  <div class="role-tabs" id="roleTabs">
    <button class="role-tab active" data-role="volunteer">志愿者注册</button>
    <button class="role-tab" data-role="school">学校用户注册</button>
  </div>

  <form id="registerForm">
    <!-- 公共字段 -->
    <div class="form-group">
      <label for="userId">账号</label>
      <input type="text" id="userId" class="form-input" placeholder="请输入账号（手机号）" required>
    </div>

    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" class="form-input" placeholder="6-20 位密码" required minlength="6" maxlength="20">
    </div>

    <div class="form-group">
      <label for="confirmPassword">确认密码</label>
      <input type="password" id="confirmPassword" class="form-input" placeholder="再次输入密码" required>
    </div>

    <div class="form-group">
      <label for="userPhone">手机号</label>
      <input type="tel" id="userPhone" class="form-input" placeholder="请输入手机号" required pattern="1[3-9]\d{9}">
    </div>

    <!-- 志愿者特有字段 -->
    <div class="form-section active" id="volunteerFields">
      <div class="form-group">
        <label for="userIdentity">真实姓名</label>
        <input type="text" id="userIdentity" class="form-input" placeholder="请输入真实姓名">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="userSex">性别</label>
          <select id="userSex" class="form-input">
            <option value="">请选择</option>
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>
        <div class="form-group">
          <label for="userEdu">学历</label>
          <select id="userEdu" class="form-input">
            <option value="">请选择</option>
            <option value="高中">高中</option>
            <option value="专科">专科</option>
            <option value="本科">本科</option>
            <option value="硕士">硕士</option>
            <option value="博士">博士</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 学校用户特有字段 -->
    <div class="form-section" id="schoolFields">
      <div class="form-group">
        <label for="schoolName">学校名称</label>
        <input type="text" id="schoolName" class="form-input" placeholder="请输入学校全称">
      </div>
      <div class="form-group">
        <label for="principle">负责人</label>
        <input type="text" id="principle" class="form-input" placeholder="请输入学校负责人姓名">
      </div>
      <div class="form-group">
        <label for="license">办学许可证号</label>
        <input type="text" id="license" class="form-input" placeholder="请输入办学许可证号">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="schoolType">学校类型</label>
          <select id="schoolType" class="form-input">
            <option value="">请选择</option>
            <option value="小学">小学</option>
            <option value="初中">初中</option>
            <option value="九年一贯制">九年一贯制</option>
          </select>
        </div>
        <div class="form-group">
          <label for="schoolAddress">学校地址</label>
          <input type="text" id="schoolAddress" class="form-input" placeholder="省/市/县/镇">
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;">注 册</button>
  </form>

  <div class="auth-footer">
    已有账号？<a href="login.html">立即登录</a>
    <br><br>
    <a href="../index.html" style="font-size:13px;color:var(--text-muted);">&larr; 返回首页</a>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
let selectedRole = 'volunteer';

// 角色切换
document.querySelectorAll('#roleTabs .role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#roleTabs .role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedRole = tab.dataset.role;

    document.getElementById('volunteerFields').classList.toggle('active', selectedRole === 'volunteer');
    document.getElementById('schoolFields').classList.toggle('active', selectedRole === 'school');

    // 切换时清除特有字段的 required
    const volFields = document.querySelectorAll('#volunteerFields input, #volunteerFields select');
    const schFields = document.querySelectorAll('#schoolFields input, #schoolFields select');
    if (selectedRole === 'volunteer') {
      volFields.forEach(f => f.setAttribute('required', ''));
      schFields.forEach(f => f.removeAttribute('required'));
    } else {
      volFields.forEach(f => f.removeAttribute('required'));
      schFields.forEach(f => f.setAttribute('required', ''));
    }
  });
});

// 初始设置必填
document.querySelectorAll('#volunteerFields input, #volunteerFields select').forEach(f => f.setAttribute('required', ''));

// 注册提交
document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (password !== confirm) {
    showToast('两次密码输入不一致', 'warning');
    return;
  }

  // 模拟注册成功（后端完成后替换为真实 API 调用）
  showToast('注册成功！即将跳转到登录页', 'success');
  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1200);
});
</script>
</body>
</html>
