<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 支教信息发布平台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main class="main">

  <!-- 用户信息卡片 -->
  <div class="card profile-header">
    <div class="profile-avatar">&#128100;</div>
    <div class="profile-info">
      <h3 id="profileName">用户</h3>
      <p id="profileRole">角色：—</p>
      <p id="profilePhone">手机号：—</p>
      <p id="profileTime">注册时间：—</p>
    </div>
    <div style="margin-left:auto;">
      <button class="btn btn-outline btn-sm" onclick="showEditProfile()">编辑资料</button>
    </div>
  </div>

  <!-- 功能标签页 -->
  <div class="tabs" style="margin-top:24px;">
    <button class="tab-item active" data-tab="registrations">我的报名</button>
    <button class="tab-item" data-tab="activities">我的活动</button>
    <button class="tab-item" data-tab="posts">我的帖子</button>
    <button class="tab-item" data-tab="security">账号安全</button>
  </div>

  <!-- 我的报名 -->
  <div class="tab-content active" id="tab-registrations">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动名称</th><th>报名时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="myRegistrationList">
            <tr><td colspan="4" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 我的活动（学校用户） -->
  <div class="tab-content" id="tab-activities" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>活动标题</th><th>状态</th><th>发布时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="myActivityList">
            <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 我的帖子 -->
  <div class="tab-content" id="tab-posts" style="display:none;">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>标题</th><th>关联活动</th><th>发布时间</th><th>审核状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="myPostList">
            <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">加载中……</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 账号安全 -->
  <div class="tab-content" id="tab-security" style="display:none;">
    <div class="card" style="max-width:500px;">
      <h3 style="margin-bottom:20px;">修改密码</h3>
      <form id="changePwdForm">
        <div class="form-group">
          <label for="oldPassword">原密码</label>
          <input type="password" id="oldPassword" class="form-input" placeholder="请输入原密码" required>
        </div>
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" class="form-input" placeholder="6-20 位新密码" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">确认新密码</label>
          <input type="password" id="confirmNewPassword" class="form-input" placeholder="再次输入新密码" required>
        </div>
        <button type="submit" class="btn btn-primary">修改密码</button>
      </form>
    </div>
  </div>
</main>

<!-- 提交总结弹窗 -->
<div class="modal-overlay" id="summaryModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">提交活动总结</h3>
      <button class="modal-close" onclick="document.getElementById('summaryModal').classList.remove('show')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="summaryForm">
        <div class="form-group">
          <label>总结标题</label>
          <input type="text" class="form-input" placeholder="请输入总结标题" required>
        </div>
        <div class="form-group">
          <label>总结内容</label>
          <textarea class="form-input" rows="5" placeholder="请详细描述活动开展情况、参与志愿者、教学成果等" required></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('summaryModal').classList.remove('show')">取消</button>
      <button class="btn btn-primary" onclick="submitSummary()">提交审核</button>
    </div>
  </div>
</div>

<footer class="footer">
  <p>&copy; 2026 支教信息发布平台 · 南京航空航天大学</p>
</footer>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const stateMap = { '0': '招募中', '1': '进行中', '2': '已结束' };
const stateClassMap = { '0': 'tag-recruiting', '1': 'tag-ongoing', '2': 'tag-ended' };
const auditClassMap = { '0': 'tag-pending', '1': 'tag-approved', '2': 'tag-rejected' };
const auditMap = { '0': '待审核', '1': '审核通过', '2': '未通过' };

// 标签页切换
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
  });
});

// 加载用户信息
async function loadProfile() {
  try {
    const user = await userApi.getInfo();
    setCurrentUser(user);
    document.getElementById('profileName').textContent = user.userId || '用户';
    document.getElementById('profileRole').textContent = '角色：' + (ROLE_NAME[user.userPermission] || '—');
    document.getElementById('profilePhone').textContent = '手机号：' + (user.userPhone || '—');
    document.getElementById('profileTime').textContent = '注册时间：' + (user.registerTime || '—');
  } catch (err) {
    // 后端未就绪时使用本地缓存
    const user = getCurrentUser();
    if (user) {
      document.getElementById('profileName').textContent = user.userId || '用户';
      document.getElementById('profileRole').textContent = '角色：' + (ROLE_NAME[user.userPermission] || '—');
      document.getElementById('profilePhone').textContent = '手机号：' + (user.userPhone || '—');
    }
  }
}

// 加载我的报名
async function loadMyRegistrations() {
  const tbody = document.getElementById('myRegistrationList');
  try {
    const result = await api.get('/registration/my');
    const list = Array.isArray(result) ? result : (result.list || []);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">暂无报名记录</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(r => `
      <tr>
        <td>${escHtml(r.activityTitle || '活动' + r.activityId)}</td>
        <td>${r.entryTime}</td>
        <td><span class="tag ${auditClassMap[r.auditState]}">${auditMap[r.auditState]}</span></td>
        <td>
          ${r.auditState === '0'
            ? `<button class="btn btn-danger btn-sm" onclick="cancelRegistration(${r.registrationId})">取消报名</button>`
            : '<span style="color:var(--text-muted);font-size:13px;">—</span>'}
        </td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  }
}

// 加载我的活动（学校用户）
async function loadMyActivities() {
  const tbody = document.getElementById('myActivityList');
  try {
    const result = await api.get('/activity/my');
    const list = Array.isArray(result) ? result : (result.list || []);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">暂无发布的活动</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(act => `
      <tr>
        <td>${escHtml(act.title)}</td>
        <td><span class="tag ${stateClassMap[act.activityState]}">${stateMap[act.activityState]}</span></td>
        <td>${(act.publishTime || '').split(' ')[0]}</td>
        <td>
          <div class="action-group">
            <button class="btn btn-outline btn-sm" onclick="showToast('编辑功能暂未开放', 'warning')">编辑</button>
            <button class="btn btn-primary btn-sm" onclick="showSummaryModal(${act.activityId})">提交总结</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  }
}

// 加载我的帖子
async function loadMyPosts() {
  const tbody = document.getElementById('myPostList');
  try {
    const result = await api.get('/post/my');
    const list = Array.isArray(result) ? result : (result.list || []);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">暂无帖子</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr>
        <td>${escHtml(p.title)}</td>
        <td>${escHtml(p.activityTitle || '活动' + p.activityId)}</td>
        <td>${(p.publishTime || '').split(' ')[0]}</td>
        <td><span class="tag ${auditClassMap[p.auditState]}">${auditMap[p.auditState]}</span></td>
        <td><button class="btn btn-danger btn-sm" onclick="deletePost(${p.postId})">删除</button></td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">加载失败</td></tr>';
  }
}

function showEditProfile() { showToast('编辑资料功能暂未开放', 'warning'); }

async function cancelRegistration(id) {
  showModal('确认取消', '<p>确定要取消该报名吗？取消后不可恢复。</p>', async () => {
    try {
      await registrationApi.cancel(id);
      showToast('报名已取消', 'success');
      await loadMyRegistrations();
    } catch (err) {
      showToast(err.message || '取消失败', 'error');
    }
  });
}

let summaryActivityId = null;
function showSummaryModal(activityId) {
  summaryActivityId = activityId;
  document.getElementById('summaryModal').classList.add('show');
}

async function submitSummary() {
  const form = document.getElementById('summaryForm');
  const title = form.querySelector('input').value.trim();
  const content = form.querySelector('textarea').value.trim();
  if (!title || !content) { showToast('请填写完整信息', 'warning'); return; }
  try {
    await activityApi.submitSummary(summaryActivityId, { title, content });
    document.getElementById('summaryModal').classList.remove('show');
    showToast('总结已提交，等待管理员审核', 'success');
  } catch (err) {
    showToast(err.message || '提交失败', 'error');
  }
}

async function deletePost(id) {
  showModal('确认删除', '<p>确定要删除该帖子吗？</p>', async () => {
    try {
      await postApi.delete(id);
      showToast('帖子已删除', 'success');
      await loadMyPosts();
    } catch (err) {
      showToast(err.message || '删除失败', 'error');
    }
  });
}

document.getElementById('summaryModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

document.getElementById('changePwdForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const oldPwd = document.getElementById('oldPassword').value;
  const np = document.getElementById('newPassword').value;
  const cp = document.getElementById('confirmNewPassword').value;
  if (np !== cp) { showToast('两次密码不一致', 'warning'); return; }
  try {
    await userApi.changePwd(oldPwd, np);
    showToast('密码修改成功', 'success');
    this.reset();
  } catch (err) {
    showToast(err.message || '修改失败', 'error');
  }
});

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadProfile();
loadMyRegistrations();
loadMyActivities();
loadMyPosts();
</script>
</body>
</html>
